{% extends "base.html" %}
{% block title %}{{ heading }} | Campus Event Hub{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-7">
    <div class="form-card">
    <h1 class="h2 mb-1">{{ heading }}</h1>
    <p class="text-body-secondary mb-4">Everything here can be edited later.</p>
    <form method="post" novalidate>
      {% csrf_token %}
      {% include "_form_fields.html" %}
      <button class="btn btn-primary" type="submit">Save event</button>
      <a class="btn btn-link" href="{% url 'home' %}">Cancel</a>
    </form>
    </div>
  </div>
</div>
{% endblock %}
