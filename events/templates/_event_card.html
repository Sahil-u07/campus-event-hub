<div class="col-12 col-md-6 col-lg-4">
  <article class="card event-card h-100">
    <div class="card-body d-flex flex-column">
      <span class="badge badge-category align-self-start mb-2">{{ event.category.name }}</span>
      <h2 class="h5 card-title"><a class="stretched-link" href="{{ event.get_absolute_url }}">{{ event.title }}</a></h2>
      <p class="card-text text-body-secondary mb-1"><i class="bi bi-clock" aria-hidden="true"></i> {{ event.start_at|date:"D, d M Y, h:i A" }}</p>
      <p class="card-text text-body-secondary mb-3"><i class="bi bi-geo-alt" aria-hidden="true"></i> {{ event.venue }}</p>
      <p class="mt-auto mb-0">
        {% if event.seats_left %}
          <span class="seats seats-ok">{{ event.seats_left }} seat{{ event.seats_left|pluralize }} left</span>
        {% else %}
          <span class="seats seats-full">Full</span>
        {% endif %}
      </p>
    </div>
  </article>
</div>
